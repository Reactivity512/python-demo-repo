[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demopkg"
version = "0.1.0"
description = "Demo package for DocScribe agent"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["demopkg*"]
